<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A staircase plot of f on the positive integers 1 to 6 with every point on the diagonal f(n) = n. Beside it the chain: from f(f(n)) &lt; f(n+1) follow f(n) ≥ n, then f strictly increasing, then f(n) &lt; n + 1, so f(n) = n." font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#111827">
  <rect width="320" height="180" rx="8" fill="#ffffff"/>
  <line x1="58" y1="150" x2="58" y2="38" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="132" x2="152" y2="132" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="164" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">1</text>
  <text x="34" y="136" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">1</text>
  <line x1="76" y1="150" x2="76" y2="38" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="114" x2="152" y2="114" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="164" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">2</text>
  <text x="34" y="118" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">2</text>
  <line x1="94" y1="150" x2="94" y2="38" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="96" x2="152" y2="96" stroke="#e5e7eb" stroke-width="1"/>
  <text x="94" y="164" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">3</text>
  <text x="34" y="100" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">3</text>
  <line x1="112" y1="150" x2="112" y2="38" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="78" x2="152" y2="78" stroke="#e5e7eb" stroke-width="1"/>
  <text x="112" y="164" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">4</text>
  <text x="34" y="82" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">4</text>
  <line x1="130" y1="150" x2="130" y2="38" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="60" x2="152" y2="60" stroke="#e5e7eb" stroke-width="1"/>
  <text x="130" y="164" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">5</text>
  <text x="34" y="64" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">5</text>
  <line x1="148" y1="150" x2="148" y2="38" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="42" x2="152" y2="42" stroke="#e5e7eb" stroke-width="1"/>
  <text x="148" y="164" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">6</text>
  <text x="34" y="46" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">6</text>
  <line x1="40" y1="150" x2="156" y2="150" stroke="#374151" stroke-width="1.2"/>
  <line x1="40" y1="150" x2="40" y2="34" stroke="#374151" stroke-width="1.2"/>
  <text x="158" y="165" font-family="Source Code Pro, ui-monospace, monospace" fill="#374151">n</text>
  <text x="44" y="26" font-family="Source Code Pro, ui-monospace, monospace" fill="#374151">f(n)</text>
  <path d="M58,132 H76 V114 H94 V96 H112 V78 H130 V60 H148 V42" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="58" cy="132" r="4" fill="#0f766e"/>
  <circle cx="76" cy="114" r="4" fill="#0f766e"/>
  <circle cx="94" cy="96" r="4" fill="#0f766e"/>
  <circle cx="112" cy="78" r="4" fill="#0f766e"/>
  <circle cx="130" cy="60" r="4" fill="#0f766e"/>
  <circle cx="148" cy="42" r="4" fill="#0f766e"/>
  <text x="176" y="32" font-family="Source Code Pro, ui-monospace, monospace">f : ℕ+ → ℕ+</text>
  <rect x="170" y="42" width="130" height="22" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="176" y="57" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e">f(f(n)) &lt; f(n+1)</text>
  <text x="176" y="86" font-family="Source Code Pro, ui-monospace, monospace">⇒ f(n) ≥ n</text>
  <text x="176" y="106" font-family="Source Code Pro, ui-monospace, monospace">⇒ f(n) &lt; f(n+1)</text>
  <text x="176" y="126" font-family="Source Code Pro, ui-monospace, monospace">⇒ f(n) &lt; n + 1</text>
  <text x="176" y="154" font-family="Source Code Pro, ui-monospace, monospace" font-size="13" font-weight="bold">f(n) = n <tspan fill="#059669">✓</tspan></text>
</svg>
