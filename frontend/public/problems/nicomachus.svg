<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A 10 by 10 square, where 10 = 1 + 2 + 3 + 4, split into L-shaped layers of areas 1, 2³, 3³ and 4³, so 1³ + 2³ + 3³ + 4³ = 100 = (1 + 2 + 3 + 4)². The key lemma in amber: each new layer adds exactly a cube, T(n+1)² = T(n)² + (n+1)³." font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#111827">
  <rect width="320" height="180" rx="8" fill="#ffffff"/>
  <polygon points="20,150 32,150 32,138 20,138" fill="#14b8a6" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="32,150 56,150 56,114 20,114 20,138 32,138" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <polygon points="56,150 92,150 92,78 20,78 20,114 56,114" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="92,150 140,150 140,30 20,30 20,78 92,78" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <path d="M32,30 v120 M20,138 h120 M44,30 v120 M20,126 h120 M56,30 v120 M20,114 h120 M68,30 v120 M20,102 h120 M80,30 v120 M20,90 h120 M92,30 v120 M20,78 h120 M104,30 v120 M20,66 h120 M116,30 v120 M20,54 h120 M128,30 v120 M20,42 h120 " stroke="#ffffff" stroke-width="0.6" opacity="0.7" fill="none"/>
  <text x="44" y="130" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="bold">2³</text>
  <text x="74" y="100" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">3³</text>
  <text x="116" y="58" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#d97706" text-anchor="middle" font-weight="bold">4³</text>
  <text x="26" y="148" font-family="Source Code Pro, ui-monospace, monospace" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="80" y="168" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">10 × 10</text>
  <text x="160" y="36" font-family="Source Code Pro, ui-monospace, monospace">1³ + 2³ + 3³ + 4³</text>
  <text x="160" y="54" font-family="Source Code Pro, ui-monospace, monospace" fill="#374151">= 1 + 8 + 27 + 64</text>
  <text x="160" y="72" font-family="Source Code Pro, ui-monospace, monospace" fill="#374151">= 100</text>
  <text x="160" y="90" font-family="Source Code Pro, ui-monospace, monospace">= (1 + 2 + 3 + 4)²</text>
  <rect x="154" y="108" width="150" height="52" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="160" y="128" font-family="Source Code Pro, ui-monospace, monospace" fill="#d97706">T(n+1)² =</text>
  <text x="168" y="148" font-family="Source Code Pro, ui-monospace, monospace" fill="#d97706">T(n)² + (n+1)³</text>
</svg>
