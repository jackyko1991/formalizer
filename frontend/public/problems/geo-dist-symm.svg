<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Two points p and q with one arrow from p to q and another from q to p, side by side and the same length; dashed legs show the squared differences (p.x − q.x)² and (p.y − q.y)², which do not change when p and q swap, because (a − b)² = (b − a)².">
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0f766e"/></marker><marker id="ah-teal2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#14b8a6"/></marker></defs>
<g font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
<line x1="40" y1="136" x2="168" y2="136" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="168" y1="136" x2="168" y2="52" stroke="#0369a1" stroke-width="1.6" stroke-dasharray="4 3"/>
<polyline points="161,136 161,129 168,129" fill="none" stroke="#374151" stroke-width="1.2"/>
<line x1="51.4" y1="136.9" x2="164.3" y2="62.8" stroke="#0f766e" stroke-width="2.2" marker-end="url(#ah-teal)"/>
<line x1="156.6" y1="51.1" x2="43.7" y2="125.2" stroke="#14b8a6" stroke-width="2.2" marker-end="url(#ah-teal2)"/>
<circle cx="40" cy="136" r="4.5" fill="#111827"/>
<circle cx="168" cy="52" r="4.5" fill="#111827"/>
<text x="31" y="140" font-size="14" fill="#111827" text-anchor="end" font-weight="600" font-style="italic">p</text>
<text x="177" y="56" font-size="14" fill="#111827" font-weight="600" font-style="italic">q</text>
<text x="104" y="152" font-size="11" fill="#d97706" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">(p.x − q.x)²</text>
<text x="176" y="98" font-size="11" fill="#0369a1" font-family="Source Code Pro, ui-monospace, monospace">(p.y − q.y)²</text>
<text x="212" y="40" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0f766e">dist2 p q</tspan></text>
<text x="212" y="60" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">= <tspan fill="#14b8a6">dist2 q p</tspan></text>
<text x="212" y="150" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">(a − b)²</text>
<text x="212" y="170" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">= (b − a)²</text>
</g>
</svg>
