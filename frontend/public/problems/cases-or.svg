<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A fork: from h : p or q, one branch has p and one has q; the p branch proves q or p by its right side (Or.inr), the q branch by its left side (Or.inl), so both reach q or p.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker></defs>
<rect width="320" height="180" fill="#ffffff"/>
<rect x="8" y="76" width="84" height="28" rx="7" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="50.0" y="95.0" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#111827">h : p ∨ q</text>
<rect x="116" y="26" width="56" height="28" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="144.0" y="45.0" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#111827">hp : p</text>
<rect x="116" y="126" width="56" height="28" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="144.0" y="145.0" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#111827">hq : q</text>
<path d="M80,76 Q90,52 112,42" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<path d="M80,104 Q90,128 112,138" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="60" y="56" font-family="Source Code Pro, ui-monospace, monospace" font-size="11" text-anchor="end" fill="#6b7280">inl</text>
<text x="60" y="132" font-family="Source Code Pro, ui-monospace, monospace" font-size="11" text-anchor="end" fill="#6b7280">inr</text>
<rect x="226" y="26" width="64" height="28" rx="7" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
<text x="258.0" y="45.0" font-family="Source Code Pro, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#111827"><tspan fill="#9ca3af">q</tspan> ∨ <tspan fill="#0f766e" font-weight="700">p</tspan></text>
<rect x="226" y="126" width="64" height="28" rx="7" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
<text x="258.0" y="145.0" font-family="Source Code Pro, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#111827"><tspan fill="#0369a1" font-weight="700">q</tspan> ∨ <tspan fill="#9ca3af">p</tspan></text>
<line x1="176" y1="40" x2="222" y2="40" stroke="#0f766e" stroke-width="2" marker-end="url(#aht)"/>
<line x1="176" y1="140" x2="222" y2="140" stroke="#0369a1" stroke-width="2" marker-end="url(#ahs)"/>
<text x="199" y="30" font-family="Source Code Pro, ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#0f766e">Or.inr</text>
<text x="199" y="160" font-family="Source Code Pro, ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#0369a1">Or.inl</text>
<text x="304" y="46" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" text-anchor="middle" fill="#059669" font-weight="700">✓</text>
<text x="304" y="146" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" text-anchor="middle" fill="#059669" font-weight="700">✓</text>
</svg>
