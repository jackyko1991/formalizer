<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="The answer a = 18, b = 1 in the integers, checked by decide. The identity (a+b)^7 − a^7 − b^7 = 7·ab(a+b)·(a²+ab+b²)² with ab(a+b) = 342, not divisible by 7, and a²+ab+b² = 343 = 7³, so 19^7 − 18^7 − 1 = 7^7 · 342." font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#111827">
  <rect width="320" height="180" rx="8" fill="#ffffff"/>
  <rect x="16" y="14" width="64" height="24" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="48" y="30" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#0369a1" text-anchor="middle">a = 18</text>
  <rect x="88" y="14" width="56" height="24" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="116" y="30" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#0369a1" text-anchor="middle">b = 1</text>
  <text x="152" y="30" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#6b7280">: ℤ</text>
  <rect x="240" y="14" width="64" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="272" y="30" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#0f766e" text-anchor="middle">decide</text>
  <text x="18" y="70" font-family="Source Code Pro, ui-monospace, monospace">(a+b)⁷ − a⁷ − b⁷</text>
  <text x="132" y="70" font-family="Source Code Pro, ui-monospace, monospace">=</text>
  <text x="145" y="70" font-family="Source Code Pro, ui-monospace, monospace" fill="#d97706" font-weight="bold">7</text>
  <text x="154" y="70" font-family="Source Code Pro, ui-monospace, monospace">·</text>
  <text x="162" y="70" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e">ab(a+b)</text>
  <text x="214" y="70" font-family="Source Code Pro, ui-monospace, monospace">·</text>
  <text x="222" y="70" font-family="Source Code Pro, ui-monospace, monospace" fill="#d97706">(a²+ab+b²)²</text>
  <line x1="162" y1="78" x2="208" y2="78" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="222" y1="78" x2="298" y2="78" stroke="#d97706" stroke-width="1.5"/>
  <text x="185" y="96" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e" text-anchor="middle">342</text>
  <text x="185" y="113" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">7 ∤ 342 <tspan fill="#059669">✓</tspan></text>
  <text x="260" y="96" font-family="Source Code Pro, ui-monospace, monospace" fill="#d97706" text-anchor="middle">343 = 7³</text>
  <text x="260" y="113" font-family="Source Code Pro, ui-monospace, monospace" fill="#d97706" text-anchor="middle">(7³)² = 7⁶</text>
  <line x1="16" y1="126" x2="304" y2="126" stroke="#e5e7eb" stroke-width="1"/>
  <text x="160" y="148" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">19⁷ − 18⁷ − 1 = 7⁷ · 342 <tspan fill="#059669">✓</tspan></text>
  <text x="160" y="167" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">281651706 = 823543 · 342</text>
</svg>
