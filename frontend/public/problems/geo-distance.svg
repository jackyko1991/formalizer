<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A coordinate grid with the points (1, 2) and (4, 6) joined by a segment of length 5; dashed legs 3 across and 4 up make a right triangle, and the squared distance is (1−4)² + (2−6)² = 9 + 16 = 25.">
<g font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
<line x1="28" y1="160" x2="28" y2="20" stroke="#e5e7eb" stroke-width="1"/>
<line x1="48" y1="160" x2="48" y2="20" stroke="#e5e7eb" stroke-width="1"/>
<line x1="68" y1="160" x2="68" y2="20" stroke="#e5e7eb" stroke-width="1"/>
<line x1="88" y1="160" x2="88" y2="20" stroke="#e5e7eb" stroke-width="1"/>
<line x1="108" y1="160" x2="108" y2="20" stroke="#e5e7eb" stroke-width="1"/>
<line x1="128" y1="160" x2="128" y2="20" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="160" x2="128" y2="160" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="140" x2="128" y2="140" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="120" x2="128" y2="120" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="100" x2="128" y2="100" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="80" x2="128" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="60" x2="128" y2="60" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="40" x2="128" y2="40" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="20" x2="128" y2="20" stroke="#e5e7eb" stroke-width="1"/>
<line x1="28" y1="160" x2="28" y2="20" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="28" y1="160" x2="128" y2="160" stroke="#9ca3af" stroke-width="1.2"/>
<text x="134" y="164" font-size="11" fill="#6b7280">x</text>
<text x="24" y="14" font-size="11" fill="#6b7280">y</text>
<line x1="48" y1="120" x2="108" y2="120" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="108" y1="120" x2="108" y2="40" stroke="#0369a1" stroke-width="2" stroke-dasharray="4 3"/>
<polyline points="101,120 101,113 108,113" fill="none" stroke="#374151" stroke-width="1.2"/>
<line x1="48" y1="120" x2="108" y2="40" stroke="#0f766e" stroke-width="2.5"/>
<circle cx="48" cy="120" r="4" fill="#0f766e"/>
<circle cx="108" cy="40" r="4" fill="#0f766e"/>
<text x="42" y="136" font-size="11" fill="#374151" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">(1, 2)</text>
<text x="116" y="34" font-size="11" fill="#374151" font-family="Source Code Pro, ui-monospace, monospace">(4, 6)</text>
<text x="78" y="135" font-size="12" fill="#d97706" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">3</text>
<text x="116" y="84" font-size="12" fill="#0369a1" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">4</text>
<text x="66" y="76" font-size="12" fill="#0f766e" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">5</text>
<text x="162" y="58" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">dist2 ⟨1,2⟩ ⟨4,6⟩</text>
<text x="162" y="84" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">= <tspan fill="#d97706">(1−4)²</tspan> + <tspan fill="#0369a1">(2−6)²</tspan></text>
<text x="162" y="108" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">= <tspan fill="#d97706">9</tspan> + <tspan fill="#0369a1">16</tspan></text>
<text x="162" y="132" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">= <tspan fill="#0f766e" font-weight="600">25</tspan> = <tspan fill="#0f766e">5²</tspan></text>
</g>
