<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Bars for x = 1.6, y = 1.25, z = 0.5 with xyz = 1: each term (x⁵ − x²)/(x⁵ + y² + z²) (teal) sits above Boreico's bound (x² − yz)/(x² + y² + z²) (sky), one term is negative, yet the sum 0.85 is at least the bound sum 0.22, which is ((x−y)² + (y−z)² + (z−x)²)/(2(x² + y² + z²)) ≥ 0." font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#111827">
  <rect width="320" height="180" rx="8" fill="#ffffff"/>
  <rect x="16" y="15" width="10" height="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="32" y="24" font-family="Source Code Pro, ui-monospace, monospace">(x⁵ − x²)/(x⁵ + y² + z²)</text>
  <rect x="16" y="33" width="10" height="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="32" y="42" font-family="Source Code Pro, ui-monospace, monospace">≥ (x² − yz)/(x² + y² + z²)</text>
  <text x="304" y="24" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">xyz ≥ 1</text>
  <line x1="30" y1="118" x2="300" y2="118" stroke="#374151" stroke-width="1"/>
  <text x="24" y="122" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">0</text>
  <line x1="228" y1="56" x2="228" y2="158" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="44" y="76.8" width="18" height="41.2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <rect x="66" y="89.7" width="18" height="28.3" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="64" y="170" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">x = 1.6</text>
  <rect x="108" y="101.7" width="18" height="16.3" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <rect x="130" y="106.8" width="18" height="11.2" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="128" y="170" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">y = 1.25</text>
  <rect x="172" y="118" width="18" height="3.4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <rect x="194" y="118" width="18" height="25.6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="192" y="170" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">z = 0.5</text>
  <rect x="238" y="63.9" width="18" height="54.1" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <rect x="268" y="104.1" width="18" height="13.9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="262" y="170" font-family="Source Code Pro, ui-monospace, monospace" fill="#059669" text-anchor="middle">Σ ≥ 0</text>
  <text x="247" y="58.9" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e" text-anchor="middle">0.85</text>
  <text x="277" y="99.1" font-family="Source Code Pro, ui-monospace, monospace" fill="#0369a1" text-anchor="middle">0.22</text>
</svg>
