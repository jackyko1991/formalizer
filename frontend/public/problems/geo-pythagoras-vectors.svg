<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="On a grid, the vector a = (4, 2) and then the vector b = (−1, 2) placed at its tip, at a right angle since a·b = −4 + 4 = 0, and their sum a + b = (3, 4). The squared lengths are 20, 5 and 25, and 20 + 5 = 25.">
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0f766e"/></marker><marker id="ah-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#d97706"/></marker><marker id="ah-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0369a1"/></marker></defs>
<g font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
<line x1="19" y1="173" x2="19" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="46" y1="173" x2="46" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="73" y1="173" x2="73" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="100" y1="173" x2="100" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="127" y1="173" x2="127" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="154" y1="173" x2="154" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="181" y1="173" x2="181" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="19" y1="173" x2="181" y2="173" stroke="#e5e7eb" stroke-width="1"/>
<line x1="19" y1="146" x2="181" y2="146" stroke="#e5e7eb" stroke-width="1"/>
<line x1="19" y1="119" x2="181" y2="119" stroke="#e5e7eb" stroke-width="1"/>
<line x1="19" y1="92" x2="181" y2="92" stroke="#e5e7eb" stroke-width="1"/>
<line x1="19" y1="65" x2="181" y2="65" stroke="#e5e7eb" stroke-width="1"/>
<line x1="19" y1="38" x2="181" y2="38" stroke="#e5e7eb" stroke-width="1"/>
<line x1="19" y1="11" x2="181" y2="11" stroke="#e5e7eb" stroke-width="1"/>
<line x1="46" y1="173" x2="46" y2="11" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="19" y1="146" x2="181" y2="146" stroke="#9ca3af" stroke-width="1.2"/>
<polyline points="146,96 141.9,88 150,84" fill="none" stroke="#374151" stroke-width="1.2"/>
<line x1="46" y1="146" x2="154" y2="92" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ah-teal)"/>
<line x1="154" y1="92" x2="127" y2="38" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah-amb)"/>
<line x1="46" y1="146" x2="127" y2="38" stroke="#0369a1" stroke-width="2.5" marker-end="url(#ah-sky)"/>
<circle cx="46" cy="146" r="3" fill="#374151"/>
<text x="102" y="133" font-size="14" fill="#0f766e" font-weight="600" font-style="italic">a</text>
<text x="158" y="107" font-size="11" fill="#0f766e" font-family="Source Code Pro, ui-monospace, monospace">(4, 2)</text>
<text x="148.5" y="53" font-size="14" fill="#d97706" font-weight="600" font-style="italic">b</text>
<text x="160" y="58.9" font-size="11" fill="#d97706" font-family="Source Code Pro, ui-monospace, monospace">(−1, 2)</text>
<text x="127" y="30" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="600"><tspan font-style="italic">a + b</tspan></text>
<text x="74.5" y="90" font-size="11" fill="#0369a1" text-anchor="end" font-family="Source Code Pro, ui-monospace, monospace">(3, 4)</text>
<text x="216" y="40" font-size="11" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">a·b = −4 + 4</text>
<text x="244" y="58" font-size="11" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">= <tspan fill="#059669" font-weight="600">0</tspan></text>
<text x="216" y="84" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0f766e">‖a‖² = 20</tspan></text>
<text x="216" y="104" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#d97706">‖b‖² = 5</tspan></text>
<text x="216" y="124" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0369a1">‖a+b‖² = 25</tspan></text>
<text x="216" y="152" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600"><tspan fill="#0f766e">20</tspan> + <tspan fill="#d97706">5</tspan> = <tspan fill="#0369a1">25</tspan></text>
</g>
</svg>
