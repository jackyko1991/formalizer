<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="The identity matrix I with 1, 0 on the first row and 0, 1 on the second, and its determinant 1·1 − 0·0 = 1. On a grid, I sends e₁ to e₁ and e₂ to e₂, so the unit square stays the unit square: areas are multiplied by 1.">
