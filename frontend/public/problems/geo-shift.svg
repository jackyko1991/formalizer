<text x="96" y="78" font-size="13" fill="#111827" text-anchor="end" font-weight="600" font-style="italic">p′</text>
<text x="172" y="60" font-size="13" fill="#111827" font-weight="600" font-style="italic">q′</text>
<text x="66" y="108" font-size="11" fill="#6b7280" text-anchor="end" font-family="Source Code Pro, ui-monospace, monospace">(a, b)</text>
<text x="202" y="44" font-size="11" fill="#374151" font-family="Source Code Pro, ui-monospace, monospace">p′ = shift p a b</text>
<text x="202" y="62" font-size="11" fill="#374151" font-family="Source Code Pro, ui-monospace, monospace">q′ = shift q a b</text>
<text x="202" y="104" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0f766e">dist2 p′ q′</tspan></text>
