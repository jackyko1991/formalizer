<line x1="24" y1="96" x2="184" y2="96" stroke="#e5e7eb" stroke-width="1"/>
<line x1="24" y1="76" x2="184" y2="76" stroke="#e5e7eb" stroke-width="1"/>
<line x1="24" y1="56" x2="184" y2="56" stroke="#e5e7eb" stroke-width="1"/>
