<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Three circles a, b and c joined by two links, h1 saying a = b and h2 saying b = c; a dashed arrow from a to c shows that together they give a = c.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker></defs>
<rect width="320" height="180" fill="#ffffff"/>
<circle cx="56" cy="72" r="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="56" y="78" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#111827" font-weight="600" font-style="italic">a</text>
<circle cx="160" cy="72" r="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="160" y="78" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#111827" font-weight="600" font-style="italic">b</text>
<circle cx="264" cy="72" r="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="264" y="78" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#111827" font-weight="600" font-style="italic">c</text>
<rect x="84" y="65" width="48" height="14" rx="7" fill="none" stroke="#374151" stroke-width="2"/>
<text x="108.0" y="77" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">=</text>
<text x="108.0" y="44" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#374151">h₁ : a = b</text>
<rect x="188" y="65" width="48" height="14" rx="7" fill="none" stroke="#374151" stroke-width="2"/>
<text x="212.0" y="77" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">=</text>
<text x="212.0" y="44" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#374151">h₂ : b = c</text>
<path d="M56,96 Q160,160 264,96" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aht)"/>
<text x="160" y="120" font-family="Source Code Pro, ui-monospace, monospace" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="600">a = c</text>
<text x="160" y="166" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#6b7280">rw [h₁, h₂]</text>
</svg>
