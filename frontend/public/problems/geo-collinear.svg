<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="On a grid, the points p = (1, 1), q = (2, 3) and r = (4, 7) all lie on the line y = 2x − 1. From p, q is 1 across and 2 up and r is 3 across and 6 up, so 1·6 − 2·3 = 0: the triangle pqr is flat.">
<g font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
<line x1="30" y1="150" x2="30" y2="22" stroke="#e5e7eb" stroke-width="1"/>
<line x1="46" y1="150" x2="46" y2="22" stroke="#e5e7eb" stroke-width="1"/>
<line x1="62" y1="150" x2="62" y2="22" stroke="#e5e7eb" stroke-width="1"/>
<line x1="78" y1="150" x2="78" y2="22" stroke="#e5e7eb" stroke-width="1"/>
<line x1="94" y1="150" x2="94" y2="22" stroke="#e5e7eb" stroke-width="1"/>
<line x1="110" y1="150" x2="110" y2="22" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="150" x2="110" y2="150" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="134" x2="110" y2="134" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="118" x2="110" y2="118" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="102" x2="110" y2="102" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="86" x2="110" y2="86" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="70" x2="110" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="54" x2="110" y2="54" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="38" x2="110" y2="38" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="22" x2="110" y2="22" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="150" x2="30" y2="22" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="30" y1="150" x2="110" y2="150" stroke="#9ca3af" stroke-width="1.2"/>
<text x="116" y="154" font-size="11" fill="#6b7280">x</text>
<text x="26" y="16" font-size="11" fill="#6b7280">y</text>
<line x1="38" y1="150" x2="102" y2="22" stroke="#14b8a6" stroke-width="2"/>
<path d="M46,134 H62 V102" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 2"/>
<path d="M46,134 H94 V38" fill="none" stroke="#0369a1" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.8"/>
<circle cx="46" cy="134" r="4.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="62" cy="102" r="4.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="94" cy="38" r="4.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
<text x="38" y="130" font-size="13" fill="#0f766e" text-anchor="end" font-weight="600" font-style="italic">p</text>
<text x="54" y="98" font-size="13" fill="#0f766e" text-anchor="end" font-weight="600" font-style="italic">q</text>
<text x="86" y="36" font-size="13" fill="#0f766e" text-anchor="end" font-weight="600" font-style="italic">r</text>
<text x="52" y="147" font-size="11" fill="#374151" font-family="Source Code Pro, ui-monospace, monospace">(1, 1)</text>
<text x="70" y="106" font-size="11" fill="#374151" font-family="Source Code Pro, ui-monospace, monospace">(2, 3)</text>
<text x="104" y="42" font-size="11" fill="#374151" font-family="Source Code Pro, ui-monospace, monospace">(4, 7)</text>
<text x="99.6" y="92.4" font-size="11" fill="#0f766e" font-family="Source Code Pro, ui-monospace, monospace">y = 2x − 1</text>
<text x="192" y="62" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#d97706">q − p = (1, 2)</tspan></text>
<text x="192" y="86" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0369a1">r − p = (3, 6)</tspan></text>
<text x="192" y="118" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#d97706">1</tspan>·<tspan fill="#0369a1">6</tspan> − <tspan fill="#d97706">2</tspan>·<tspan fill="#0369a1">3</tspan></text>
<text x="192" y="140" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">= 6 − 6 = <tspan fill="#059669" font-weight="600">0</tspan></text>
</g>
</svg>
