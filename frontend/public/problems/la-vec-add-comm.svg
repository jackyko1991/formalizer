<text x="146" y="102" font-size="14" fill="#d97706" font-weight="600" font-style="italic">v</text>
<text x="100" y="65" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="600" font-style="italic">u</text>
<text x="156" y="58" font-size="11" fill="#0369a1" font-family="Source Code Pro, ui-monospace, monospace">(5, 4)</text>
<text x="214" y="54" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0f766e">u</tspan> = (4, 1)</text>
