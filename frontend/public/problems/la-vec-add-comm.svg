<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="On a grid, u = (4, 1) followed by v = (1, 3), and v followed by u, are the two sides of a parallelogram; both paths end at the same corner (5, 4), so u + v = v + u.">
