<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A clock of the residues 0 to 6 modulo 7: doubling cycles 1, 2, 4 and back to 1, never reaching 6. A table for n = 0 to 6: 2^n mod 7 is 1, 2, 4, 1, 2, 4, 1, equal to 1 exactly when 3 divides n, and 2^n + 1 mod 7 is 2, 3, 5, never 0, n = 0 included." font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#111827">
  <rect width="320" height="180" rx="8" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
  <circle cx="76" cy="94" r="52" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="119.6" y1="74.3" x2="123.4" y2="91" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="115" y1="111.2" x2="66.9" y2="134.4" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="61.5" y1="130.7" x2="107.3" y2="73.3" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="60" y="96" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">×2</text>
  <circle cx="76" cy="42" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="76" y="46" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">0</text>
  <circle cx="116.7" cy="61.6" r="11" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="116.7" y="65.6" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">1</text>
  <circle cx="126.7" cy="105.6" r="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="126.7" y="109.6" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">2</text>
  <circle cx="98.6" cy="140.9" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="98.6" y="144.9" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">3</text>
  <circle cx="53.4" cy="140.9" r="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="53.4" y="144.9" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">4</text>
  <circle cx="25.3" cy="105.6" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="25.3" y="109.6" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">5</text>
  <circle cx="35.3" cy="61.6" r="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="35.3" y="65.6" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">6</text>
  <text x="19.7" y="54.1" font-size="13" fill="#dc2626" text-anchor="middle">✗</text>
  <text x="76" y="24" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">mod 7</text>
  <text x="150" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280">n</text>
  <text x="150" y="64" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e">2ⁿ</text>
  <text x="150" y="88" font-family="Source Code Pro, ui-monospace, monospace">2ⁿ+1</text>
  <rect x="197" y="51" width="14" height="18" rx="3" fill="#d1fae5"/>
  <text x="204" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">0</text>
  <text x="204" y="64" font-family="Source Code Pro, ui-monospace, monospace" fill="#059669" text-anchor="middle">1</text>
  <text x="204" y="88" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">2</text>
  <text x="220" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">1</text>
