  <text x="236" y="88" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">5</text>
  <rect x="245" y="51" width="14" height="18" rx="3" fill="#d1fae5"/>
  <text x="252" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">3</text>
  <text x="252" y="64" font-family="Source Code Pro, ui-monospace, monospace" fill="#059669" text-anchor="middle">1</text>
  <text x="252" y="88" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">2</text>
  <text x="268" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">4</text>
  <text x="268" y="64" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e" text-anchor="middle">2</text>
  <text x="268" y="88" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">3</text>
  <text x="284" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">5</text>
  <text x="284" y="64" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e" text-anchor="middle">4</text>
  <text x="284" y="88" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">5</text>
  <rect x="293" y="51" width="14" height="18" rx="3" fill="#d1fae5"/>
  <text x="300" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">6</text>
  <text x="300" y="64" font-family="Source Code Pro, ui-monospace, monospace" fill="#059669" text-anchor="middle">1</text>
  <text x="300" y="88" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">2</text>
  <line x1="150" y1="46" x2="306" y2="46" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="150" y1="100" x2="306" y2="100" stroke="#e5e7eb" stroke-width="1"/>
  <text x="150" y="124" font-family="Source Code Pro, ui-monospace, monospace">2ⁿ ≡ 1 ↔ 3 ∣ n <tspan fill="#059669">✓</tspan></text>
  <text x="150" y="146" font-family="Source Code Pro, ui-monospace, monospace">7 ∤ 2ⁿ+1, n ≥ 0 <tspan fill="#059669">✓</tspan></text>
  <text x="150" y="166" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280">(mod 7)</text>
</svg>
