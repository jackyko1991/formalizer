<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Points a, b and c on a number line with a hop from a to b (h1: a ≤ b) and a hop from b to c (h2: b ≤ c); together they make the long dashed hop a ≤ c, which is Nat.le_trans h1 h2.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker></defs>
<rect width="320" height="180" fill="#ffffff"/>
<line x1="20" y1="96" x2="300" y2="96" stroke="#d1d5db" stroke-width="1.5"/>
<path d="M56,88 Q103.0,44 148,86" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<path d="M150,88 Q207.0,44 262,86" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="103.0" y="50" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#374151">h₁ : a ≤ b</text>
<text x="207.0" y="50" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#374151">h₂ : b ≤ c</text>
<circle cx="56" cy="96" r="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="56" y="120" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="600" font-style="italic">a</text>
<circle cx="150" cy="96" r="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="150" y="120" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="600" font-style="italic">b</text>
<circle cx="264" cy="96" r="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="264" y="120" font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="600" font-style="italic">c</text>
<path d="M56,128 Q160,158 262,130" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aht)"/>
<text x="160" y="170" font-family="Source Code Pro, ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="600">a ≤ c</text>
<text x="160" y="24" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#6b7280">Nat.le_trans h₁ h₂</text>
</svg>
