<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="The matrix A with entries a, b, c, d times the identity matrix I with entries 1, 0, 0, 1 equals A again. The first row of A times the first column of I gives the top-left entry a·1 + b·0 = a.">
<g font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
<rect x="28" y="32" width="28" height="28" rx="3" fill="#ccfbf1"/>
