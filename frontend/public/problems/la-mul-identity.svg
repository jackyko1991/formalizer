<text x="142" y="51.8" font-size="16" fill="#d97706" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">1</text>
<text x="174" y="51.8" font-size="16" fill="#6b7280" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">0</text>
<rect x="128" y="64" width="28" height="28" rx="3" fill="#fef3c7"/>
<text x="142" y="83.8" font-size="16" fill="#d97706" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">0</text>
<text x="174" y="83.8" font-size="16" fill="#6b7280" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">1</text>
<path d="M131,30 H126 V94 H131" fill="none" stroke="#374151" stroke-width="1.5"/>
<path d="M185,30 H190 V94 H185" fill="none" stroke="#374151" stroke-width="1.5"/>
<rect x="228" y="32" width="28" height="28" rx="3" fill="#e0f2fe"/>
<text x="242" y="51.8" font-size="16" fill="#0369a1" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">a</text>
<text x="274" y="51.8" font-size="16" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">b</text>
<text x="242" y="83.8" font-size="16" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">c</text>
<text x="274" y="83.8" font-size="16" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">d</text>
<path d="M231,30 H226 V94 H231" fill="none" stroke="#374151" stroke-width="1.5"/>
<path d="M285,30 H290 V94 H285" fill="none" stroke="#374151" stroke-width="1.5"/>
<text x="58" y="20" font-size="13" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">A</text>
<text x="158" y="20" font-size="13" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">I</text>
<text x="258" y="20" font-size="13" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">A</text>
<text x="108" y="68" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">·</text>
<text x="208" y="68" font-size="18" fill="#111827" text-anchor="middle" font-weight="600">=</text>
<text x="160" y="132" font-size="15" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0f766e">a</tspan>·<tspan fill="#d97706">1</tspan> + <tspan fill="#0f766e">b</tspan>·<tspan fill="#d97706">0</tspan> = <tspan fill="#0369a1" font-weight="600">a</tspan></text>
<text x="160" y="158" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">A.mul Mat2.identity = A</text>
