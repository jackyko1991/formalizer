<text x="74" y="51.8" font-size="16" fill="#0f766e" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">b</text>
<text x="42" y="83.8" font-size="16" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">c</text>
<text x="74" y="83.8" font-size="16" fill="#111827" text-anchor="middle" font-family="Source Code Pro, ui-monospace, monospace">d</text>
<path d="M31,30 H26 V94 H31" fill="none" stroke="#374151" stroke-width="1.5"/>
<path d="M85,30 H90 V94 H85" fill="none" stroke="#374151" stroke-width="1.5"/>
