<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Each inequality (a² − ce)(b² − ce) ≤ 0 says ce lies between a² and b², drawn on a number line; the five come from shifting a, b, c, d, e cyclically. Adding them gives a sum of squares at most 0, so every square is 0: for positive reals the five hold exactly when a = b = c = d = e, five equal bars." font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#111827">
  <rect width="320" height="180" rx="8" fill="#ffffff"/>
  <text x="16" y="30" font-family="Source Code Pro, ui-monospace, monospace">(a² − ce)(b² − ce) ≤ 0</text>
  <line x1="20" y1="66" x2="176" y2="66" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="44" y="59" width="108" height="14" fill="#ccfbf1"/>
  <line x1="44" y1="58" x2="44" y2="74" stroke="#374151" stroke-width="1.5"/>
  <line x1="152" y1="58" x2="152" y2="74" stroke="#374151" stroke-width="1.5"/>
  <circle cx="100" cy="66" r="5" fill="#0f766e"/>
  <text x="44" y="90" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">a²</text>
  <text x="100" y="90" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e" text-anchor="middle">ce</text>
  <text x="152" y="90" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">b²</text>
  <text x="16" y="118" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280">↻ a → b → c → d → e</text>
  <text x="16" y="146" font-family="Source Code Pro, ui-monospace, monospace">Σ (…)² ≤ 0 ⇒ (…)² = 0</text>
  <text x="194" y="100" font-size="22" fill="#374151" text-anchor="middle">↔</text>
  <rect x="216" y="52" width="12" height="64" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="222" y="132" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">a</text>
  <rect x="234" y="52" width="12" height="64" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="240" y="132" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">b</text>
  <rect x="252" y="52" width="12" height="64" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="258" y="132" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">c</text>
  <rect x="270" y="52" width="12" height="64" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="276" y="132" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">d</text>
  <rect x="288" y="52" width="12" height="64" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="294" y="132" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">e</text>
  <line x1="210" y1="116" x2="304" y2="116" stroke="#374151" stroke-width="1"/>
  <text x="204" y="120" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="end">0</text>
  <text x="258" y="156" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle">a=b=c=d=e <tspan fill="#059669">✓</tspan></text>
  <text x="258" y="40" font-family="Source Code Pro, ui-monospace, monospace" fill="#6b7280" text-anchor="middle">a…e > 0</text>
</svg>
