<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A pentagon of the unknowns x1 to x5: each one times y equals the sum of its two neighbours, as in x5 + x2 = y·x1. The solutions: all zero for any y; all equal when y = 2; or, when y² + y − 1 = 0, the family (s, t, yt − s, −yt − ys, ys − t)." font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#111827">
  <rect width="320" height="180" rx="8" fill="#ffffff"/>
  <line x1="74" y1="42" x2="121.6" y2="76.5" stroke="#d97706" stroke-width="3"/>
  <line x1="121.6" y1="76.5" x2="103.4" y2="132.5" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="103.4" y1="132.5" x2="44.6" y2="132.5" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="44.6" y1="132.5" x2="26.4" y2="76.5" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="26.4" y1="76.5" x2="74" y2="42" stroke="#d97706" stroke-width="3"/>
  <circle cx="74" cy="42" r="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="74" y="46" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">x₁</text>
  <circle cx="121.6" cy="76.5" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="121.6" y="80.5" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">x₂</text>
  <circle cx="103.4" cy="132.5" r="13" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="103.4" y="136.5" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">x₃</text>
  <circle cx="44.6" cy="132.5" r="13" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="44.6" y="136.5" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">x₄</text>
  <circle cx="26.4" cy="76.5" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="26.4" y="80.5" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" text-anchor="middle">x₅</text>
  <text x="74" y="96" fill="#6b7280" text-anchor="middle">ℝ⁵</text>
  <text x="74" y="168" font-family="Source Code Pro, ui-monospace, monospace" text-anchor="middle"><tspan fill="#d97706">x₅ + x₂</tspan> = y·<tspan fill="#0f766e">x₁</tspan></text>
  <rect x="150" y="12" width="156" height="36" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="158" y="26" font-family="Source Code Pro, ui-monospace, monospace" fill="#374151">∀ y</text>
  <text x="158" y="41" font-family="Source Code Pro, ui-monospace, monospace">(0, 0, 0, 0, 0)</text>
  <text x="228" y="58" fill="#6b7280" text-anchor="middle">∨</text>
  <rect x="150" y="62" width="156" height="36" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text x="158" y="76" font-family="Source Code Pro, ui-monospace, monospace" fill="#0369a1">y = 2</text>
  <text x="158" y="91" font-family="Source Code Pro, ui-monospace, monospace">(c, c, c, c, c)</text>
  <text x="228" y="108" fill="#6b7280" text-anchor="middle">∨</text>
  <rect x="150" y="112" width="156" height="56" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="158" y="126" font-family="Source Code Pro, ui-monospace, monospace" fill="#0f766e">y² + y − 1 = 0</text>
  <text x="158" y="142" font-family="Source Code Pro, ui-monospace, monospace">(s, t, yt − s,</text>
  <text x="166" y="158" font-family="Source Code Pro, ui-monospace, monospace">−yt − ys, ys − t)</text>
</svg>
