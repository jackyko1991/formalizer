<text x="103" y="118" font-size="11" fill="#0369a1" font-weight="600" font-style="italic">u+v</text>
<text x="138" y="136" font-size="13" fill="#0f766e" font-weight="600" font-style="italic">2u</text>
<text x="159" y="90" font-size="13" fill="#d97706" font-weight="600" font-style="italic">2v</text>
<text x="162" y="46" font-size="12" fill="#0369a1" text-anchor="end" font-weight="600" font-style="italic">2(u+v)</text>
<text x="214" y="50" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#0f766e">u</tspan> = (3, 1)</text>
<text x="214" y="70" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace"><tspan fill="#d97706">v</tspan> = (1, 2)</text>
<text x="214" y="90" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">k = 2</text>
<text x="214" y="124" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600"><tspan fill="#0369a1">k(u + v)</tspan></text>
<text x="214" y="146" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">= <tspan fill="#0f766e">ku</tspan> + <tspan fill="#d97706">kv</tspan></text>
