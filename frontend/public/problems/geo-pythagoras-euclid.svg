<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A triangle A B C drawn in a plane of the space P, with a right angle at B (angle A B C = π/2); the sides AB and CB are the legs and AC is the hypotenuse, and AC² = AB² + CB².">
<g font-family="Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
<path d="M14,160 L52,16 L222,16 L184,160 z" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="30" y="152" font-size="12" fill="#6b7280" font-style="italic">P</text>
<line x1="70" y1="140" x2="195.5" y2="99.2" stroke="#d97706" stroke-width="3"/>
<line x1="70" y1="140" x2="40.3" y2="48.7" stroke="#0f766e" stroke-width="3"/>
<line x1="40.3" y1="48.7" x2="195.5" y2="99.2" stroke="#0369a1" stroke-width="3"/>
<polyline points="80.5,136.6 77.1,126.1 66.6,129.5" fill="none" stroke="#374151" stroke-width="1.2"/>
<circle cx="40.3" cy="48.7" r="3.5" fill="#111827"/>
<circle cx="70" cy="140" r="3.5" fill="#111827"/>
<circle cx="195.5" cy="99.2" r="3.5" fill="#111827"/>
<text x="32.3" y="44.7" font-size="14" fill="#111827" text-anchor="end" font-weight="600">A</text>
<text x="61" y="146" font-size="14" fill="#111827" text-anchor="end" font-weight="600">B</text>
<text x="203.5" y="105.2" font-size="14" fill="#111827" font-weight="600">C</text>
<text x="92" y="124" font-size="11" fill="#374151" font-family="Source Code Pro, ui-monospace, monospace">π/2</text>
<text x="234" y="60" font-size="12" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace">∠ABC = π/2</text>
<line x1="234" y1="76" x2="308" y2="76" stroke="#e5e7eb" stroke-width="1"/>
<text x="234" y="100" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600"><tspan fill="#0369a1">AC²</tspan></text>
<text x="234" y="122" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">= <tspan fill="#0f766e">AB²</tspan></text>
<text x="234" y="144" font-size="13" fill="#111827" font-family="Source Code Pro, ui-monospace, monospace" font-weight="600">+ <tspan fill="#d97706">CB²</tspan></text>
</g>
</svg>
