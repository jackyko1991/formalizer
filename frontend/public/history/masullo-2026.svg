<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Two proofs of the same day in mirror image: a Lean proof that machines check but no one has read yet, and a natural-language proof that people read, with AI-assisted readers finding gaps</title><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#9ca3af'/></marker></defs><rect width='480' height='300' rx='14' fill='#f8fafc'/><text x='240' y='26' font-size='12' font-weight='600' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle'>20 November 2026</text><text x='24' y='62' font-size='11' font-weight='600' fill='#0f766e' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif'>AI + Lean</text><rect x='24' y='72' width='128' height='62' rx='9' fill='#ffffff' stroke='#9ca3af' stroke-width='1.4'/><text x='88.0' y='100.0' font-size='12' font-weight='600' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle'>Alpöge + Claude</text><text x='88.0' y='116.0' font-size='10.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle'>write in Lean</text><line x1='152' y1='103' x2='170' y2='103' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#a)'/><rect x='176' y='72' width='128' height='62' rx='9' fill='#ccfbf1' stroke='#0f766e' stroke-width='1.4'/><text x='240.0' y='100.0' font-size='12' font-weight='600' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle'>Machines check</text><text x='240.0' y='116.0' font-size='10.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle'>kernels: ✓ / running</text><line x1='304' y1='103' x2='322' y2='103' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#a)'/><rect x='3