<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Lean 4: programs, theorems and tactics written in the same language</title><rect width='480' height='300' rx='14' fill='#f8fafc'/><rect x='30' y='30' width='420' height='240' rx='8' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><rect x='30' y='30' width='420' height='30' rx='8' fill='#eef2f7' stroke='#d1d5db' stroke-width='1.5'/><text x='46' y='50' font-size='12' fill='#6b7280' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='normal'>Main.lean</text><text x='48' y='90' font-size='12.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='48.0' fill='#0f766e'>def</tspan><tspan x='70.5' fill='#1f2937'> double (n : Nat) : Nat := n + n</tspan></text><text x='48' y='110' font-size='12.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'></text><text x='48' y='130' font-size='12.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='48.0' fill='#0f766e'>theorem</tspan><tspan x='100.5' fill='#1f2937'> double_eq (n : Nat) :</tspan></text><text x='48' y='150' font-size='12.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='48.0' fill='#1f2937'>    double n = 2 * n := </tspan><tspan x='228.0' fill='#0f766e'>by</tspan></text><text x='48' y='170' font-size='12.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='48.0' fill='#1f2937'>  unfold double; </tspan><tspan x='175.5' fill='#0f766e'>omega</tspan></text><text x='48' y='190' font-size='12.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'></text><text x='48' y='210' font-size='12.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='48.0' fill='#0f766e'>macro</tspan><tspan x='85.5' fill='#1f2937'> "my_tac" : tactic =&gt; `(tactic| omega)</tspan></text><text x='438' y='90' font-size='10.5' fill='#0f766e' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='bold'>program</text><text x='438' y='130' font-size='10.5' fill='#0f766e' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='bold'>theorem</text><text x='438' y='210' font-size='10.5' fill='#0f766e' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='bold'>tactic</text></svg>
