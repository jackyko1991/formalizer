<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>A Mizar-style proof that reads like prose, next to the shelves of the Mizar Mathematical Library</title><rect width='480' height='300' rx='14' fill='#f8fafc'/><rect x='28' y='34' width='270' height='232' rx='8' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='46' y='66' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#0f766e'>theorem</tspan><tspan x='94.3' fill='#1f2937'> Th1:</tspan></text><text x='46' y='85' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#1f2937'>  for a, b being Real</tspan></text><text x='46' y='104' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#1f2937'>  st a &lt; b holds a &lt; (a + b) / 2</tspan></text><text x='46' y='123' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#0f766e'>proof</tspan></text><text x='46' y='142' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#1f2937'>  let a, b be Real;</tspan></text><text x='46' y='161' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#1f2937'>  </tspan><tspan x='59.8' fill='#0f766e'>assume</tspan><tspan x='101.2' fill='#1f2937'> A1: a &lt; b;</tspan></text><text x='46' y='180' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#1f2937'>  </tspan><tspan x='59.8' fill='#0f766e'>then</tspan><tspan x='87.4' fill='#1f2937'> a + a &lt; a + b</tspan></text><text x='46' y='199' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#6b7280'>    by XREAL_1:6;</tspan></text><text x='46' y='218' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#1f2937'>  </tspan><tspan x='59.8' fill='#0f766e'>hence</tspan><tspan x='94.3' fill='#1f2937'> thesis</tspan><tspan x='142.6' fill='#6b7280'> by XREAL_1:74;</tspan></text><text x='46' y='237' font-size='11.5' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill='#1f2937' xml:space='preserve'><tspan x='46.0' fill='#0f766e'>end</tspan><tspan x='66.7' fill='#1f2937'>;</tspan></text><rect x='330' y='74' width='22' height='150' rx='3' fill='#0f766e' stroke='#0f766e' stroke-width='0'/><rect x='356' y='80' width='22' height='144' rx='3' fill='#14b8a6' stroke='#0f766e' stroke-width='0'/><rect x='382' y='74' width='22' height='150' rx='3' fill='#5eead4' stroke='#0f766e' stroke-width='0'/><rect x='408' y='80' width='22' height='144' rx='3' fill='#0f766e' stroke='#0f766e' stroke-width='0'/><rect x='434' y='74' width='22' height='150' rx='3' fill='#0d9488' stroke='#0f766e' stroke-width='0'/><line x1='318' y1='226' x2='470' y2='226' stroke='#6b7280' stroke-width='2'/><text x='394' y='254' font-size='16' fill='#0f766e' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='bold'>MML</text><text x='394' y='272' font-size='10.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>Mizar Mathematical Library</text></svg>
