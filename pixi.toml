[workspace]
name = "formalizer"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
fastapi = ">=0.115"
uvicorn = ">=0.30"
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.6"

[tasks]
# Lean itself comes from elan (https://github.com/leanprover/elan); the runner needs `lake` on PATH.
lean-build = { cmd = "lake build && lake build repl", cwd = "lean" }
runner = "python -m backend.serve"
test = "pytest -q tests"
lint = "ruff check backend tests && ruff format --check backend tests"
