name: Deploy site to GitHub Pages

# The static site. learnkit (the shared layer) is a private submodule: the checkout fetches it with a read-only
# deploy key stored as the secret LEARNKIT_DEPLOY_KEY.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # learnkit is private: without its deploy key the submodule can't be fetched. Say so plainly.
      - name: Check the learnkit deploy key
        env:
          KEY: ${{ secrets.LEARNKIT_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=Missing secret LEARNKIT_DEPLOY_KEY::learnkit (vendor/learnkit) is a private repository. Add a read-only deploy key to jackyko1991/learnkit and its private key as the secret LEARNKIT_DEPLOY_KEY in this repository (README: CI setup)."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          ssh-key: ${{ secrets.LEARNKIT_DEPLOY_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node --test tests/*.test.ts
        working-directory: vendor/learnkit/web
      - run: npm run build
        working-directory: frontend
      - uses: actions/configure-pages@v6.0.0
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: frontend/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
